# ------------------------------------------------------------
# Production profile — Postgres (e.g. Neon free tier)
# Activate with:  SPRING_PROFILES_ACTIVE=prod
# Required environment variables (set in your host, never commit):
#   DATABASE_URL   JDBC URL, e.g. jdbc:postgresql://ep-xxx-123.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
#   DB_USERNAME    Postgres user (from Neon dashboard)
#   DB_PASSWORD    Postgres password (from Neon dashboard)
#   JWT_SECRET     Random 32+ char secret (signing JWS tokens)
#   OPENROUTER_API_KEY  Real OpenRouter key (https://openrouter.ai/keys)
# ------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
openrouter.api.key=${OPENROUTER_API_KEY}
